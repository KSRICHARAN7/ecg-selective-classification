name: Verify public evidence
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  aggregate-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify integrity and aggregate arithmetic
        run: python tools/verify_release.py
